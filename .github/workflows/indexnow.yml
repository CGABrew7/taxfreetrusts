name: IndexNow ping

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for key and ping changed URLs
        env:
          INDEXNOW_HOST: taxfreetrusts.com
          INDEXNOW_KEY: a0216682750007fd9d2333c73d281c25
          INDEXNOW_KIND: static-html
          INDEXNOW_SLASH: never
        run: python3 .github/scripts/indexnow_ping.py
